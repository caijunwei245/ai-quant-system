name: Backtest accounting checks

on:
  pull_request:
    paths:
      - "ai-quant-system/backtest/**"
      - "ai-quant-system/pipeline.py"
      - "ai-quant-system/data/fetcher.py"
      - "ai-quant-system/data/alpha_training.py"
      - "ai-quant-system/scripts/train_screening.py"
      - "ai-quant-system/config/settings.yaml"
      - "ai-quant-system/layers/screening.py"
      - "ai-quant-system/tests/**"
      - ".github/workflows/backtest-checks.yml"
  push:
    branches:
      - "fix/backtest-accounting-engine"

jobs:
  syntax-and-ledger-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-quant-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn loguru pyyaml matplotlib pytest
      - name: Compile changed Python modules
        run: python -m compileall -q backtest pipeline.py data/fetcher.py data/alpha_training.py layers/screening.py scripts/train_screening.py tests
      - name: Run unittest suite
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run pytest suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
